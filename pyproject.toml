[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-media-service"
version = "0.1.0"
description = "Reusable Django media service app for uploads, thumbnails, and HLS processing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Your Team"}]
dependencies = [
  "Django>=5.0",
  "djangorestframework>=3.15",
  "celery>=5.4",
  "boto3>=1.34",
  "Pillow>=10.0",
  "ffmpeg-python>=0.2.0",
  "python-magic>=0.4.27",
  "requests>=2.31",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["django_media_service*"]
